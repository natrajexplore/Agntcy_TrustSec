# AgentTrustSec identity -> role map — the ISE authorization policy that assigns SGTs.
# The AGNTCY badge proves WHO (verified id); this file decides WHAT ROLE.
# Deny by default: an id not listed here gets no role -> BLOCK. Wildcards are rejected.
#
# Keys are badge subjects (`credentialSubject.id` = AGNTCY metadata id), issued by
# `agenttrustsec-lab` on the lab Identity Node — see docs/notes-p1.md, step 4.

agents:
  AGNTCY-13cbc3cf-89ae-43d6-b5b4-b0681092b8fb: reader      # reader-01
  AGNTCY-c55ca3ee-802d-4209-8352-343197d644ae: reviewer    # reviewer-01
  AGNTCY-f3f8503b-43e7-4cd1-8822-2ff32a78db84: executor    # executor-01

mcp_servers:
  AGNTCY-2e3bc5c0-7bc2-4c5f-a055-ff6ae74d0add: mcp_server   # netops-mcp (MCPServerBadge)

# D2 (docs/P3-design.md): keys bound OUTSIDE the badge. Only for badges that cannot carry
# a key — the MCPServerBadge is built from MCP discovery. Agent badges bind their key
# inside the issuer signature; a conflict with this table is a BadgeError.
key_thumbprints:
  AGNTCY-2e3bc5c0-7bc2-4c5f-a055-ff6ae74d0add: 5q9tysl6LGnq_Z5s9UNy9IWFqa5V9-4xYCRsLPkTgIc   # netops-mcp
