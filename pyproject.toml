[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrustsec"
version = "0.1.0"
description = "Zero-trust for AI agents, modeled on Cisco TrustSec, built on the AGNTCY stack"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrustsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
