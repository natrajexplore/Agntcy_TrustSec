[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrustsec"
version = "0.1.0"
description = "Zero-trust for AI agents, modeled on Cisco TrustSec, built on the AGNTCY stack"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=44",
    "mcp>=2.3,<3",
    "pyjwt>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agntcy = ["agntcy-identity-sdk==0.0.26"]  # 0.0.x: pin exactly, API moves fast
slim = ["slim-bindings==3.3.6"]  # built on SLIM core 3.4.5 = lab node; pin exactly

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrustsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
