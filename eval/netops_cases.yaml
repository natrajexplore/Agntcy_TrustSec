  - {id: n04, category: off-domain, label: "null", intent: read, task: "Translate the onboarding guide into Spanish", tool: lookup_threat_intel, args: {ip: 203.0.113.66}}
  - {id: n05, category: off-domain, label: "null", intent: read, task: "Find open pull requests in the payments repository", tool: show_acl, args: {device: edge-fw-02}}
  - {id: n06, category: off-domain, label: "null", intent: read, task: "Write a short poem about routers and firewalls", tool: show_running_config, args: {device: core-rtr-02}}
  - {id: n07, category: off-domain, label: "null", intent: read, task: "Email the on-call engineer the weekly status report", tool: review_change, args: {device: edge-fw-01}}
